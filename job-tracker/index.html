<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Tracker</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --border: #e3e5eb;
    --text: #1f2430;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --radius: 10px;
    --applied: #6366f1;
    --interview: #d97706;
    --rejected: #dc2626;
    --offer: #059669;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 64px;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 24px;
  }

  h1 {
    font-size: 1.75rem;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }

  .card h2 {
    font-size: 1.05rem;
    margin: 0 0 16px;
  }

  form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  input, select, textarea {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }

  textarea {
    resize: vertical;
    min-height: 44px;
  }

  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  button {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }

  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: #f0f1f5;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .toolbar .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filters select, .filters input {
    padding: 7px 10px;
    font-size: 0.85rem;
  }

  .count {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
    vertical-align: top;
  }

  th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  tbody tr:hover {
    background: #fafafd;
  }

  .notes-cell {
    max-width: 220px;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
  }

  .badge.applied { background: var(--applied); }
  .badge.interview { background: var(--interview); }
  .badge.rejected { background: var(--rejected); }
  .badge.offer { background: var(--offer); }

  .row-actions {
    display: flex;
    gap: 6px;
    white-space: nowrap;
  }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    padding: 5px 10px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .icon-btn:hover {
    background: #f0f1f5;
    color: var(--text);
  }

  .icon-btn.danger:hover {
    background: #fef2f2;
    color: var(--rejected);
    border-color: #fca5a5;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 0.9rem;
  }

  @media (max-width: 640px) {
    table, thead, tbody, th, td, tr {
      display: block;
    }
    thead {
      display: none;
    }
    tbody tr {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 10px 12px;
    }
    td {
      border: none;
      padding: 6px 0;
    }
    td::before {
      content: attr(data-label);
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 2px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Job Application Tracker</h1>
      <div class="subtitle">Keep tabs on every application, right in your browser.</div>
    </header>

    <div class="card">
      <h2 id="form-title">Add Application</h2>
      <form id="entry-form">
        <input type="hidden" id="entry-id">
        <div class="field">
          <label for="company">Company</label>
          <input type="text" id="company" required placeholder="Acme Inc.">
        </div>
        <div class="field">
          <label for="role">Role</label>
          <input type="text" id="role" required placeholder="Frontend Engineer">
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="applied">Applied</option>
            <option value="interview">Interview</option>
            <option value="rejected">Rejected</option>
            <option value="offer">Offer</option>
          </select>
        </div>
        <div class="field">
          <label for="date">Date Applied</label>
          <input type="date" id="date">
        </div>
        <div class="field full">
          <label for="notes">Notes</label>
          <textarea id="notes" placeholder="Recruiter contact, interview prep, links..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" id="cancel-edit" class="btn-secondary" style="display:none;">Cancel</button>
          <button type="submit" class="btn-primary" id="submit-btn">Add Application</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">Applications</h2>
        <div class="filters">
          <input type="text" id="search" placeholder="Search company or role...">
          <select id="filter-status">
            <option value="">All statuses</option>
            <option value="applied">Applied</option>
            <option value="interview">Interview</option>
            <option value="rejected">Rejected</option>
            <option value="offer">Offer</option>
          </select>
        </div>
      </div>
      <div class="count" id="count"></div>
      <div id="table-wrap"></div>
    </div>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'jobTrackerEntries';

  const form = document.getElementById('entry-form');
  const idField = document.getElementById('entry-id');
  const companyField = document.getElementById('company');
  const roleField = document.getElementById('role');
  const statusField = document.getElementById('status');
  const dateField = document.getElementById('date');
  const notesField = document.getElementById('notes');
  const formTitle = document.getElementById('form-title');
  const submitBtn = document.getElementById('submit-btn');
  const cancelBtn = document.getElementById('cancel-edit');
  const tableWrap = document.getElementById('table-wrap');
  const countEl = document.getElementById('count');
  const searchInput = document.getElementById('search');
  const filterStatus = document.getElementById('filter-status');

  function loadEntries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('Failed to load entries', e);
      return [];
    }
  }

  function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  let entries = loadEntries();

  function resetForm() {
    form.reset();
    idField.value = '';
    formTitle.textContent = 'Add Application';
    submitBtn.textContent = 'Add Application';
    cancelBtn.style.display = 'none';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function statusLabel(status) {
    return status.charAt(0).toUpperCase() + status.slice(1);
  }

  function render() {
    const search = searchInput.value.trim().toLowerCase();
    const statusFilter = filterStatus.value;

    let filtered = entries.filter(e => {
      const matchesSearch = !search ||
        e.company.toLowerCase().includes(search) ||
        e.role.toLowerCase().includes(search);
      const matchesStatus = !statusFilter || e.status === statusFilter;
      return matchesSearch && matchesStatus;
    });

    filtered = filtered.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    countEl.textContent = `${filtered.length} of ${entries.length} application${entries.length === 1 ? '' : 's'}`;

    if (filtered.length === 0) {
      tableWrap.innerHTML = `<div class="empty-state">${entries.length === 0 ? 'No applications yet. Add your first one above.' : 'No applications match your filters.'}</div>`;
      return;
    }

    const rows = filtered.map(e => `
      <tr>
        <td data-label="Company">${escapeHtml(e.company)}</td>
        <td data-label="Role">${escapeHtml(e.role)}</td>
        <td data-label="Status"><span class="badge ${e.status}">${statusLabel(e.status)}</span></td>
        <td data-label="Date Applied">${formatDate(e.date)}</td>
        <td data-label="Notes" class="notes-cell">${e.notes ? escapeHtml(e.notes) : '—'}</td>
        <td data-label="Actions">
          <div class="row-actions">
            <button class="icon-btn" data-action="edit" data-id="${e.id}">Edit</button>
            <button class="icon-btn danger" data-action="delete" data-id="${e.id}">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');

    tableWrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Company</th>
            <th>Role</th>
            <th>Status</th>
            <th>Date Applied</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    const company = companyField.value.trim();
    const role = roleField.value.trim();
    if (!company || !role) return;

    const editingId = idField.value;

    if (editingId) {
      const entry = entries.find(e => e.id === editingId);
      if (entry) {
        entry.company = company;
        entry.role = role;
        entry.status = statusField.value;
        entry.date = dateField.value;
        entry.notes = notesField.value.trim();
      }
    } else {
      entries.push({
        id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
        company,
        role,
        status: statusField.value,
        date: dateField.value,
        notes: notesField.value.trim()
      });
    }

    saveEntries(entries);
    resetForm();
    render();
  });

  cancelBtn.addEventListener('click', resetForm);

  tableWrap.addEventListener('click', function (ev) {
    const btn = ev.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;

    if (action === 'delete') {
      if (confirm('Delete this application?')) {
        entries = entries.filter(e => e.id !== id);
        saveEntries(entries);
        render();
      }
    } else if (action === 'edit') {
      const entry = entries.find(e => e.id === id);
      if (!entry) return;
      idField.value = entry.id;
      companyField.value = entry.company;
      roleField.value = entry.role;
      statusField.value = entry.status;
      dateField.value = entry.date || '';
      notesField.value = entry.notes || '';
      formTitle.textContent = 'Edit Application';
      submitBtn.textContent = 'Save Changes';
      cancelBtn.style.display = 'inline-block';
      companyField.focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  searchInput.addEventListener('input', render);
  filterStatus.addEventListener('change', render);

  render();
})();
</script>
</body>
</html>
